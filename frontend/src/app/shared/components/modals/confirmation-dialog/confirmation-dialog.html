<dialog #nativeDialog class="dialog-element" [ngClass]="[type]">
  <div class="dialog-content">
    <div class="dialog-header">
      <div class="dialog-icon-badge" [ngClass]="[type]">
        <!-- Warning/Danger Alert SVG -->
        <svg *ngIf="type === 'danger'" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
        
        <!-- Info SVG -->
        <svg *ngIf="type === 'info'" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
        
        <!-- Success SVG -->
        <svg *ngIf="type === 'success'" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
      </div>
      <h3 class="dialog-title">{{ title }}</h3>
    </div>
    
    <div class="dialog-body">
      <p>{{ message }}</p>
    </div>
    
    <div class="dialog-footer">
      <button class="dialog-btn btn-cancel" (click)="onCancel()" type="button">
        {{ cancelText }}
      </button>
      <button class="dialog-btn btn-confirm" (click)="onConfirm()" [ngClass]="[type]" type="button">
        {{ confirmText }}
      </button>
    </div>
  </div>
</dialog>
