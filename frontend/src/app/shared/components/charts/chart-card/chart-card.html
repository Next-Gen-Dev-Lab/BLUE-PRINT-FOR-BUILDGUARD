<div class="chart-card">
  <div class="chart-header" *ngIf="title">
    <h5 class="chart-title">{{ title }}</h5>
  </div>
  
  <div class="chart-body" [style.height.px]="height">
    <!-- SVG Line Chart -->
    <svg *ngIf="chartType === 'line'" class="svg-chart" viewBox="0 0 500 220" preserveAspectRatio="none">
      <defs>
        <linearGradient id="lineGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.4"/>
          <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.0"/>
        </linearGradient>
      </defs>

      <!-- Y Grid Lines -->
      <g class="grid-lines">
        <line *ngFor="let grid of gridLines" 
              [attr.x1]="padding" 
              [attr.y1]="getYGridCoord(grid)" 
              [attr.x2]="svgWidth - padding" 
              [attr.y2]="getYGridCoord(grid)" />
      </g>

      <!-- Area fill path -->
      <path *ngIf="lineAreaPath" [attr.d]="lineAreaPath" fill="url(#lineGrad)"></path>

      <!-- Line stroke path -->
      <path *ngIf="linePath" [attr.d]="linePath" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path>

      <!-- Point dots & Values -->
      <g *ngFor="let point of linePoints" class="chart-dot-group">
        <circle [attr.cx]="point.x" [attr.cy]="point.y" r="5" fill="#ffffff" stroke="#2563eb" stroke-width="2.5" class="chart-dot"></circle>
        <text [attr.x]="point.x" [attr.y]="point.y - 10" text-anchor="middle" class="chart-value-text">{{ point.value }}</text>
      </g>

      <!-- X Axis Labels -->
      <g class="axis-labels">
        <text *ngFor="let point of linePoints" 
              [attr.x]="point.x" 
              [attr.y]="svgHeight - padding + 20" 
              text-anchor="middle" 
              class="label-text">{{ point.label }}</text>
      </g>
    </svg>

    <!-- SVG Bar Chart -->
    <svg *ngIf="chartType === 'bar'" class="svg-chart" viewBox="0 0 500 220" preserveAspectRatio="none">
      <defs>
        <linearGradient id="barGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#f97316"/>
          <stop offset="100%" stop-color="#ea580c"/>
        </linearGradient>
      </defs>

      <!-- Y Grid Lines -->
      <g class="grid-lines">
        <line *ngFor="let grid of gridLines" 
              [attr.x1]="padding" 
              [attr.y1]="getYGridCoord(grid)" 
              [attr.x2]="svgWidth - padding" 
              [attr.y2]="getYGridCoord(grid)" />
      </g>

      <!-- Bars -->
      <g *ngFor="let bar of bars" class="bar-group">
        <rect [attr.x]="bar.x" 
              [attr.y]="bar.y" 
              [attr.width]="24" 
              [attr.height]="bar.height" 
              rx="4" 
              fill="url(#barGrad)"
              class="chart-bar"></rect>
        <text [attr.x]="bar.x + 12" [attr.y]="bar.y - 8" text-anchor="middle" class="chart-value-text">{{ bar.value }}</text>
      </g>

      <!-- X Axis Labels -->
      <g class="axis-labels">
        <text *ngFor="let bar of bars" 
              [attr.x]="bar.x + 12" 
              [attr.y]="svgHeight - padding + 20" 
              text-anchor="middle" 
              class="label-text">{{ bar.label }}</text>
      </g>
    </svg>

    <!-- Circular Compliance Gauge -->
    <div *ngIf="chartType === 'gauge'" class="gauge-container">
      <div class="gauge-svg-wrapper">
        <svg width="180" height="180" viewBox="0 0 180 180">
          <defs>
            <linearGradient id="gaugeGrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#10b981"/>
              <stop offset="100%" stop-color="#059669"/>
            </linearGradient>
          </defs>
          <circle cx="90" cy="90" [attr.r]="gaugeRadius" fill="transparent" stroke="#f1f5f9" stroke-width="12"></circle>
          <circle cx="90" cy="90" [attr.r]="gaugeRadius" 
                  fill="transparent" 
                  stroke="url(#gaugeGrad)" 
                  stroke-width="12" 
                  stroke-linecap="round"
                  [attr.stroke-dasharray]="gaugeCircumference"
                  [attr.stroke-dashoffset]="gaugeStrokeDashoffset"
                  transform="rotate(-90 90 90)"
                  class="gauge-progress"></circle>
        </svg>
        <div class="gauge-text-overlay">
          <span class="gauge-number">{{ score }}%</span>
          <span class="gauge-label">Compliance</span>
        </div>
      </div>
      
      <div class="gauge-details">
        <div class="status-indicator" [ngClass]="{
          'status-excellent': score >= 90,
          'status-caution': score >= 75 && score < 90,
          'status-warning': score < 75
        }">
          <span class="indicator-dot"></span>
          {{ score >= 90 ? 'Excellent Site Safety' : (score >= 75 ? 'Standard Safety Compliance' : 'Critical Action Required') }}
        </div>
      </div>
    </div>
  </div>
</div>
