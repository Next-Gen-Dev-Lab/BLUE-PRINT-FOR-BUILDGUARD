<div class="upload-container">
  <div class="drag-zone" 
       [ngClass]="{'drag-over': isDragOver}"
       (click)="triggerInputClick()"
       (dragover)="onDragOver($event)"
       (dragleave)="onDragLeave($event)"
       (drop)="onDrop($event)"
       (keydown.enter)="triggerInputClick()"
       (keydown.space)="triggerInputClick(); $event.preventDefault()">
       
    <label for="dragZoneFileInput" class="sr-only">Choose file to upload</label>
    <input id="dragZoneFileInput"
           type="file" 
           #fileInput 
           [accept]="accept" 
           [multiple]="multiple" 
           (change)="onFileChange($event)" 
           class="hidden-input">
           
    <div class="upload-icon-wrapper">
      <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
    </div>
    
    <div class="drag-text-group">
      <span class="primary-text">Drag files here or <span class="highlight">browse</span></span>
      <span class="secondary-text">{{ helperText }}</span>
    </div>
  </div>

  <!-- Selected Files Preview List -->
  <div class="files-preview-list" *ngIf="selectedFiles.length > 0">
    <div class="file-item" *ngFor="let file of selectedFiles; let i = index">
      <div class="file-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
      </div>
      <div class="file-details">
        <span class="file-name">{{ file.name }}</span>
        <span class="file-size">{{ formatBytes(file.size) }}</span>
      </div>
      <button class="remove-file-btn" (click)="removeFile(i, $event)" type="button" aria-label="Remove file">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
    </div>
  </div>
</div>
