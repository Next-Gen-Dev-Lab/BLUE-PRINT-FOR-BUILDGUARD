<div class="auth-bg">
  <div class="auth-card-container">
    <div class="auth-card">
      <div class="auth-logo">
        <svg xmlns="http://www.w3.org/2000/svg" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" stroke="#ea580c" stroke-width="3"></rect><path d="M12 8v8M8 12h8" stroke="#1e3a8a" stroke-width="3"></path></svg>
        <span class="logo-text">Build<span class="orange-text">Guard</span></span>
      </div>

      <div *ngIf="!isSent">
        <div class="auth-header">
          <h2>Recover Password</h2>
          <p>Provide your registered work email. We will send a secure token link to reset your account credentials.</p>
        </div>

        <form [formGroup]="forgotForm" (ngSubmit)="onSubmit()" class="auth-form">
          <!-- Email Field -->
          <div class="form-group">
            <label for="email">Work Email</label>
            <div class="input-wrapper" [ngClass]="{'has-error': forgotForm.get('email')?.touched && forgotForm.get('email')?.invalid}">
              <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
              <input type="email" 
                     id="email" 
                     formControlName="email" 
                     placeholder="name@company.com"
                     autocomplete="username">
            </div>
            <span class="validation-message" *ngIf="forgotForm.get('email')?.touched && forgotForm.get('email')?.hasError('required')">
              Work email is required
            </span>
            <span class="validation-message" *ngIf="forgotForm.get('email')?.touched && forgotForm.get('email')?.hasError('email')">
              Please enter a valid email address
            </span>
          </div>

          <button type="submit" class="auth-btn" [disabled]="forgotForm.invalid || isLoading">
            <span *ngIf="!isLoading">Send Reset Link</span>
            <app-loading-spinner *ngIf="isLoading" size="sm" color="white"></app-loading-spinner>
          </button>

          <div class="auth-footer">
            <a routerLink="/auth/login" class="register-link">Return to Sign In</a>
          </div>
        </form>
      </div>

      <!-- Success Recovery Sent Screen -->
      <div *ngIf="isSent" class="success-screen">
        <div class="success-icon-wrapper">
          <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
        </div>
        
        <div class="auth-header text-center">
          <h2>Recovery Email Sent</h2>
          <p>{{ successMessage }}</p>
        </div>

        <button routerLink="/auth/login" class="auth-btn w-full">
          Back to Login
        </button>
      </div>
    </div>
  </div>
</div>
