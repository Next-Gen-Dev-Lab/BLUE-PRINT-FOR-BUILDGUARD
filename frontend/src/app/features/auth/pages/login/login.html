<div class="auth-bg">
  <div class="auth-card-container">
    <div class="auth-card">
      <div class="auth-logo">
        <svg xmlns="http://www.w3.org/2000/svg" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" stroke="#ea580c" stroke-width="3"></rect><path d="M12 8v8M8 12h8" stroke="#1e3a8a" stroke-width="3"></path></svg>
        <span class="logo-text">Build<span class="orange-text">Guard</span></span>
      </div>
      
      <div class="auth-header">
        <h2>Welcome Back</h2>
        <p>Enter your credentials to access the safety compliance cockpit.</p>
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="auth-form">
        <!-- Error Banner -->
        <div *ngIf="errorMessage" class="error-banner">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
          <span>{{ errorMessage }}</span>
        </div>

        <!-- Email Field -->
        <div class="form-group">
          <label for="email">Work Email</label>
          <div class="input-wrapper" [ngClass]="{'has-error': loginForm.get('email')?.touched && loginForm.get('email')?.invalid}">
            <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
            <input type="email" 
                   id="email" 
                   formControlName="email" 
                   placeholder="name@company.com" 
                   autocomplete="username"
                   inputmode="email">
          </div>
          <span class="validation-message" *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.hasError('required')">
            Work email is required
          </span>
          <span class="validation-message" *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.hasError('email')">
            Please enter a valid email address
          </span>
        </div>

        <!-- Password Field -->
        <div class="form-group">
          <div class="label-row">
            <label for="password">Password</label>
            <a routerLink="/auth/forgot-password" class="forgot-link">Forgot Password?</a>
          </div>
          <div class="input-wrapper" [ngClass]="{'has-error': loginForm.get('password')?.touched && loginForm.get('password')?.invalid}">
            <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
            <input type="password" 
                   id="password" 
                   formControlName="password" 
                   placeholder="Min. 6 characters" 
                   autocomplete="current-password">
          </div>
          <span class="validation-message" *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.hasError('required')">
            Password is required
          </span>
          <span class="validation-message" *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.hasError('minlength')">
            Password must be at least 6 characters long
          </span>
        </div>

        <!-- Remember Me Checkbox -->
        <div class="checkbox-row">
          <label class="custom-checkbox">
            <input type="checkbox" formControlName="rememberMe">
            <span class="checkmark"></span>
            <span class="checkbox-label">Remember this device</span>
          </label>
        </div>

        <!-- Login Buttons -->
        <button type="submit" class="auth-btn" [disabled]="loginForm.invalid || isLoading">
          <span *ngIf="!isLoading">Sign In</span>
          <app-loading-spinner *ngIf="isLoading" size="sm" color="white"></app-loading-spinner>
        </button>

        <div class="auth-footer">
          <span>New to BuildGuard?</span>
          <a routerLink="/auth/register" class="register-link">Create Account</a>
        </div>
      </form>
    </div>
  </div>
</div>
