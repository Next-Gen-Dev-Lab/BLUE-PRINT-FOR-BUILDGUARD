<div class="auth-bg">
  <div class="auth-card-container">
    <div class="auth-card">
      <div class="auth-logo">
        <svg xmlns="http://www.w3.org/2000/svg" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" stroke="#ea580c" stroke-width="3"></rect><path d="M12 8v8M8 12h8" stroke="#1e3a8a" stroke-width="3"></path></svg>
        <span class="logo-text">Build<span class="orange-text">Guard</span></span>
      </div>



      <div class="auth-header text-center">
        <h2>Account Created Successfully</h2>
        <p>Your registration is complete.</p>
      </div>

      <div class="account-details-card" *ngIf="pendingUser">
        <h5>Operator Profile</h5>
        <div class="detail-row">
          <span class="detail-label">Full Name</span>
          <span class="detail-val">{{ pendingUser.name }}</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Employee ID</span>
          <span class="detail-val font-mono">{{ pendingUser.employeeId }}</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Company</span>
          <span class="detail-val">{{ pendingUser.companyName }}</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Work Role</span>
          <span class="detail-val">{{ getRoleLabel(pendingUser.role) }}</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Work Email</span>
          <span class="detail-val">{{ pendingUser.email }}</span>
        </div>
      </div>



      <button routerLink="/auth/login" class="auth-btn w-full">
        Return to Sign In
      </button>
    </div>
  </div>
</div>
