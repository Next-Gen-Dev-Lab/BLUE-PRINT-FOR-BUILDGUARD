<div class="error-viewport">
  <div class="error-card">
    <div class="error-icon-wrapper danger animate-fade-in">
      <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 22 22 22 12 2"></polygon><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
    </div>
    
    <h1 class="error-code danger">500</h1>
    <h2>Internal Safety Engine Crash</h2>
    <p class="error-msg">A critical connection failure occurred in the compliance database pool. Stack trace diagnostic log is attached below.</p>

    <!-- Stack trace -->
    <pre class="error-stack-trace">{{ stackTrace }}</pre>

    <div class="error-actions">
      <a routerLink="/dashboard" class="primary-btn">Reload Dashboard</a>
    </div>
  </div>
</div>
